name: Inkbox
description: Inkbox is a direct-to-consumer e-commerce company selling semi-permanent
  temporary tattoos. Its proprietary "For Now Ink" formula is made with Genipa plant
  extract and develops into the skin to last up to about two weeks, longer than
  surface-level temporary tattoos. Inkbox sells thousands of pre-designed tattoos
  from independent artists and offers a custom service where customers upload their
  own artwork to create personalized designs. The business operates as a consumer
  retail brand with an online store, and does not publish a public developer API,
  developer portal, or API documentation.
